repos:
  # Ruff runs from the project venv, so its version comes from uv.lock — the
  # same one `mise run lint`, CI and your editor use. No second pin to drift.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        # ruff also formats Python code blocks inside Markdown.
        types_or: [python, pyi, markdown]
        require_serial: true
      - id: uv-lock
        name: uv.lock is up to date
        entry: uv lock --check
        language: system
        files: ^(uv\.lock|.*pyproject\.toml)$
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run --no-sync actionlint
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: zizmor
        name: zizmor
        entry: uv run --no-sync zizmor --offline .github
        language: system
        files: ^\.github/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.(devcontainer|vscode)/  # JSONC (comments) is valid there
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
