name: Release

# A pushed tag `vX.Y.Z` releases version X.Y.Z: build and check once, publish those
# bytes to PyPI after a manual approval, verify the install by name, then create
# the GitHub Release. See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Trust this repo's mise.toml (it sets env vars and defines tasks).
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TAG: ${{ github.ref_name }}

jobs:
  dist:
    name: Build, check and install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: dagger
          cache: false
      # Never pipe `dagger` output: a pipe can mask its exit status.
      - run: mise run release:dist "$TAG"
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # Holds the OIDC token: runs no repository code, only these two steps.
  publish-pypi:
    name: Publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/yandex-disk-rescue/${{ needs.dist.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing: PyPI accepts the OIDC token instead of a stored secret
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/dist/

  verify-pypi:
    name: Verify the install from PyPI
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: dagger
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: mise run release:verify "$TAG"

  github-release:
    name: GitHub Release
    needs: [dist, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release with the CHANGELOG notes and the two files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.dist.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" =~ [0-9](a|b|rc)[0-9]+ ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release/dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "yandex-disk-rescue $VERSION" --notes-file release/notes.md "${prerelease[@]}"
