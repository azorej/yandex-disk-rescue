version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot moves the SHA and its `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed, so a compromised tag has time to be caught and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: chore
