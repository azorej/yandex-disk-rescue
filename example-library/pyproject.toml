[project]
name = "example-library"
version = "0.1.0"
description = "An example Python library demonstrating workspace packaging best practices"
authors = [
    {name = "Author Name", email = "author@example.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_library"]
